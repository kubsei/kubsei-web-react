name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

# Deploys are Vercel's GitHub integration (main = production, PRs = previews): no deploy job here
jobs:
  build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # /ai must stay closed: without credentials, and without AI_USER/AI_PASSWORD set at all
      - name: Check /ai is protected
        run: |
          npx next start -p 3000 &
          until curl -s -o /dev/null localhost:3000/es; do sleep 1; done
          for path in /ai /ai/x; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "localhost:3000$path")
            echo "$path -> $code"
            [ "$code" = "401" ]
          done
